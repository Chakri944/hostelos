<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owner Login · HostelOS</title><link rel="stylesheet" href="/static/styles.css"></head>
<body class="login-page"><main class="login-card">
<div class="brand login-brand"><span class="brand-mark">H</span><div><b>HostelOS</b><small>OWNER ACCESS</small></div></div>
<h1>Welcome back</h1><p class="muted">Sign in to manage your hostel.</p>
{% if error %}<div class="notice error">Email or password is incorrect. Please try again.</div>{% endif %}
<form method="post" action="/login" class="login-form">
<label>Email address<input type="email" name="email" autocomplete="username" required></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button class="primary" type="submit">Sign in</button></form>
<p class="login-foot">Your hostel records are private to your account.</p>
</main></body></html>
